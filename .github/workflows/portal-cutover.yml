name: One-time portal infrastructure cutover

on:
  workflow_run:
    workflows: ["Deploy Cloudflare Pages"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  remove-legacy-delivery:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
        contains(github.event.workflow_run.head_commit.message, 'Prestige redesign') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Apply the forward-only database migration
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply booboo-beschwerde-portal-db --remote --config=wrangler.toml
      - name: Remove the old webhook, Worker, queue consumers and queues
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          if (!token || !account) throw new Error('Cloudflare credentials are not configured.');

                    const failures = [];
          
                    async function telegramDeleteWebhook() {
                      const botToken = process.env.TELEGRAM_BOT_TOKEN;
                      if (!botToken) {
                        failures.push('Telegram webhook removal skipped because its credential is unavailable.');
                        return;
                      }
                      try {
                        const response = await fetch('https://api.telegram.org/bot' + botToken + '/deleteWebhook', {
                          method: 'POST',
                          headers: { 'content-type': 'application/json' },
                          body: JSON.stringify({ drop_pending_updates: true }),
                        });
                        const result = await response.json().catch(() => ({}));
                        if (!response.ok || result.ok !== true) {
                          failures.push('Telegram webhook removal failed (HTTP ' + response.status + ').');
                        }
                      } catch {
                        failures.push('Telegram webhook removal failed due to a network error.');
                      }
                    }
          
                    async function cloudflare(method, path, { missingOk = false } = {}) {
                      try {
                        const response = await fetch('https://api.cloudflare.com/client/v4' + path, {
                          method,
                          headers: {
                            authorization: 'Bearer ' + token,
                            'content-type': 'application/json',
                          },
                        });
                        if (missingOk && response.status === 404) return null;
                        const result = await response.json().catch(() => ({}));
                        if (!response.ok || result.success === false) {
                          const codes = (result.errors || []).map((item) => item.code).filter(Boolean).join(', ');
                          failures.push(method + ' Cloudflare request failed (HTTP ' + response.status + (codes ? ', error ' + codes : '') + ').');
                          return null;
                        }
                        return result;
                      } catch {
                        failures.push(method + ' Cloudflare request failed due to a network error.');
                        return null;
                      }
                    }
          
                    await telegramDeleteWebhook();
                    const base = '/accounts/' + encodeURIComponent(account);
                    const queuesResponse = await cloudflare('GET', base + '/queues?page=1&per_page=100');
                    const targetQueueNames = new Set([
                      'booboo-telegram-notifications',
                      'booboo-telegram-notifications-failed',
                    ]);
                    const queues = queuesResponse?.result || [];
                    for (const queue of queues.filter((item) => targetQueueNames.has(item.queue_name))) {
                      const consumersResponse = await cloudflare('GET', base + '/queues/' + encodeURIComponent(queue.queue_id) + '/consumers');
                      for (const consumer of consumersResponse?.result || []) {
                        if (consumer.script_name !== 'booboo-telegram-notifier') continue;
                        const consumerId = consumer.consumer_id || consumer.id;
                        if (!consumerId) {
                          failures.push('A legacy queue consumer was missing its identifier.');
                          continue;
                        }
                        await cloudflare('DELETE', base + '/queues/' + encodeURIComponent(queue.queue_id) + '/consumers/' + encodeURIComponent(consumerId), { missingOk: true });
                      }
                    }
                    await cloudflare('DELETE', base + '/workers/scripts/booboo-telegram-notifier', { missingOk: true });
                    for (const queue of queues.filter((item) => targetQueueNames.has(item.queue_name))) {
                      if (!queue.queue_id) {
                        failures.push('A legacy queue was missing its identifier.');
                        continue;
                      }
                      await cloudflare('DELETE', base + '/queues/' + encodeURIComponent(queue.queue_id), { missingOk: true });
                    }
                    if (failures.length) {
                      console.error('Legacy service cleanup incomplete: ' + failures.join(' | '));
                      process.exitCode = 1;
                    } else {
                      console.log('The old webhook, Worker, queue consumers and queues were removed.');
                    }
          NODE
