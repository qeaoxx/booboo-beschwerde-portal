name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/deploy-pages.yml'
      - 'public/**'
      - 'functions/**'
      - 'lib/**'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.toml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  statuses: write
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run complete checks
        run: npm run check

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: cloudflare-pages-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://booboo-portal.pages.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mark deployment pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'cloudflare-pages-production',
              description: 'Deploying to Cloudflare Pages'
            });

      - name: Verify Cloudflare credentials
        id: credentials
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing GitHub secret: CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing GitHub secret: CLOUDFLARE_ACCOUNT_ID'; exit 1; }

      - name: Report missing Cloudflare credentials
        if: steps.credentials.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const common = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'failure'
            };
            await github.rest.repos.createCommitStatus({
              ...common,
              context: 'cloudflare-pages-credentials',
              description: 'Missing CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID'
            });
            await github.rest.repos.createCommitStatus({
              ...common,
              context: 'cloudflare-pages-production',
              description: 'Deployment blocked by missing Cloudflare credentials'
            });

      - name: Stop when credentials are missing
        if: steps.credentials.outcome == 'failure'
        run: exit 1

      - name: Deploy production to Cloudflare Pages
        id: pages-deploy
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=booboo-portal --branch=main --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Mark deployment successful
        if: steps.pages-deploy.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'cloudflare-pages-production',
              description: 'Cloudflare Pages production is live',
              target_url: 'https://booboo-portal.pages.dev'
            });

      - name: Record sanitized deployment error
        if: steps.pages-deploy.outcome == 'failure' && steps.credentials.outcome == 'success'
        uses: actions/github-script@v7
        env:
          COMMAND_STDERR: ${{ steps.pages-deploy.outputs.command-stderr }}
          COMMAND_OUTPUT: ${{ steps.pages-deploy.outputs.command-output }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          script: |
            let output = `${process.env.COMMAND_STDERR || ''}\n${process.env.COMMAND_OUTPUT || ''}`.trim();
            for (const secret of [process.env.CLOUDFLARE_API_TOKEN, process.env.CLOUDFLARE_ACCOUNT_ID].filter(Boolean)) {
              output = output.split(secret).join('[REDACTED]');
            }
            output = output
              .replace(/Bearer\s+[^\s]+/gi, 'Bearer [REDACTED]')
              .replace(/([?&](?:token|key|secret)=)[^&\s]+/gi, '$1[REDACTED]');
            if (!output) output = 'Wrangler lieferte keinen auswertbaren Fehlertext.';
            output = output.slice(-5000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 6,
              body: `## Deploy fehlgeschlagen\n\nCommit: \`${context.sha}\`\n\n\`\`\`text\n${output}\n\`\`\``
            });
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'failure',
              context: 'cloudflare-pages-production',
              description: 'Cloudflare Pages deployment failed'
            });

      - name: Fail job after deployment error
        if: steps.pages-deploy.outcome == 'failure' && steps.credentials.outcome == 'success'
        run: exit 1
