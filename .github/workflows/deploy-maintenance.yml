name: Deploy Booboo maintenance worker

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-maintenance.yml'
      - 'maintenance-worker/**'
      - 'lib/**'
      - 'migrations/**'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npx wrangler deploy --dry-run --config maintenance-worker/wrangler.toml

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: cloudflare-maintenance-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Deploy scheduled maintenance
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config maintenance-worker/wrangler.toml
