name: Deploy Telegram Worker

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/deploy-notifier.yml'
      - 'telegram-notifier/**'
      - 'lib/**'
      - 'migrations/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run complete checks
        run: npm run check
      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run --config telegram-notifier/wrangler.toml

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: cloudflare-telegram-worker-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install deployment dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Mark Worker deployment pending
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'cloudflare-telegram-worker',
              description: 'Deploying Telegram notification Worker'
            });

      - name: Verify Cloudflare credentials
        id: credentials
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing GitHub secret: CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing GitHub secret: CLOUDFLARE_ACCOUNT_ID'; exit 1; }

      - name: Deploy Telegram Worker
        id: notifier-deploy
        if: steps.credentials.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set +e
          npx wrangler deploy --config telegram-notifier/wrangler.toml --keep-vars > wrangler-notifier.log 2>&1
          status=$?
          cat wrangler-notifier.log
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Mark Worker deployment successful
        if: steps.notifier-deploy.outputs.exit_code == '0'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'success',
              context: 'cloudflare-telegram-worker',
              description: 'Telegram notification Worker is live'
            });

      - name: Report Worker deployment failure
        if: steps.credentials.outcome == 'failure' || steps.notifier-deploy.outputs.exit_code != '0'
        uses: actions/github-script@v7
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          script: |
            const fs = require('fs');
            let output = steps.credentials?.outcome === 'failure'
              ? 'Cloudflare-Zugangsdaten fehlen oder sind leer.'
              : (fs.existsSync('wrangler-notifier.log')
                ? fs.readFileSync('wrangler-notifier.log', 'utf8').trim()
                : 'Wrangler hat keine Logdatei erzeugt.');
            for (const secret of [process.env.CLOUDFLARE_API_TOKEN, process.env.CLOUDFLARE_ACCOUNT_ID].filter(Boolean)) {
              output = output.split(secret).join('[REDACTED]');
            }
            output = output
              .replace(/Bearer\s+[^\s]+/gi, 'Bearer [REDACTED]')
              .replace(/([?&](?:token|key|secret)=)[^&\s]+/gi, '$1[REDACTED]')
              .slice(-7000);
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 6,
              body: `## Telegram-Worker-Deploy fehlgeschlagen\n\nCommit: \`${context.sha}\`\nRun-ID: \`${context.runId}\`\nRun: ${runUrl}\n\n\`\`\`text\n${output}\n\`\`\``
            });
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'failure',
              context: 'cloudflare-telegram-worker',
              description: 'Telegram notification Worker deployment failed'
            });

      - name: Fail job after Worker deployment error
        if: steps.credentials.outcome == 'failure' || steps.notifier-deploy.outputs.exit_code != '0'
        run: exit 1
